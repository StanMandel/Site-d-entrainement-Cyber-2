  <script type="text/plain" id="installateur-outils-windows">
@echo off
setlocal EnableExtensions
title Installation des outils - Attaques Windows
echo ============================================================
echo   Installation des outils d'attaque (Windows)
echo   nmap, Impacket, NetExec, enum4linux-ng, Responder, PsExec
echo ============================================================
echo   A n'utiliser que sur un reseau de test dont vous avez
echo   l'autorisation. Idealement dans une machine virtuelle.
echo ============================================================
echo.

rem --- Droits administrateur obligatoires (winget + exclusion Defender) ---
net session >nul 2>nul
if errorlevel 1 (
  echo [X] Ce script doit etre lance en administrateur.
  echo     Clic droit sur "installer-outils.cmd" ^> "Executer en tant qu'administrateur",
  echo     ou ouvrez un terminal admin puis relancez-le.
  goto :fin
)
echo [OK] Droits administrateur confirmes.

rem --- Exclusion Windows Defender ---------------------------------------------
rem Impacket, NetExec et Responder contiennent des scripts que Defender supprime
rem comme "virus" (HackTool) pendant l'installation. On exclut les deux dossiers
rem qui les recoivent. Pour annuler plus tard :
rem   Remove-MpPreference -ExclusionPath "%LOCALAPPDATA%\pipx"
rem   Remove-MpPreference -ExclusionPath "%USERPROFILE%\outils-attaques"
echo [..] Ajout des exclusions Defender (dossiers pipx et outils-attaques)...
powershell -NoProfile -Command "Add-MpPreference -ExclusionPath '%LOCALAPPDATA%\pipx' -ErrorAction SilentlyContinue; Add-MpPreference -ExclusionPath '%USERPROFILE%\outils-attaques' -ErrorAction SilentlyContinue"
if errorlevel 1 (
  echo [!] Exclusion non ajoutee (Defender absent ou protection contre les
  echo     falsifications active). L'installation peut echouer sur impacket/netexec.
) else (
  echo [OK] Exclusions Defender ajoutees.
)

rem --- winget : gestionnaire de paquets integre a Windows 10/11 ---
where winget >nul 2>nul
if errorlevel 1 (
  echo [X] winget est introuvable.
  echo     Installez "App Installer" depuis le Microsoft Store puis relancez.
  echo     https://apps.microsoft.com/detail/9NBLGGH4NNS1
  goto :fin
)
echo [OK] winget detecte.

rem --- nmap ---
call :assure_cmd nmap "Insecure.Nmap" "nmap"

rem --- Git (necessaire pour cloner Responder et installer NetExec) ---
call :assure_cmd git "Git.Git" "Git"

rem --- Python 3 (detecte via python puis via le lanceur py) ---
set "PY="
python -V >nul 2>nul && set "PY=python"
if not defined PY ( py -3 -V >nul 2>nul && set "PY=py -3" )
if not defined PY (
  echo [..] Installation de Python 3...
  winget install --id Python.Python.3.12 -e --source winget --accept-package-agreements --accept-source-agreements
  python -V >nul 2>nul && set "PY=python"
  if not defined PY ( py -3 -V >nul 2>nul && set "PY=py -3" )
) else (
  echo [OK] Python deja present.
)

if not defined PY (
  echo.
  echo [!] Python vient d'etre installe mais n'est pas encore dans le PATH
  echo     de cette fenetre. Rouvrez un terminal admin et relancez ce script pour
  echo     terminer l'installation d'Impacket, NetExec et enum4linux-ng.
  goto :psexec
)

rem --- pip + pipx (installation isolee des outils Python) ---
%PY% -m pip --version >nul 2>nul
if errorlevel 1 (
  echo [X] pip indisponible pour cette installation de Python.
  goto :psexec
)
%PY% -m pipx --version >nul 2>nul
if errorlevel 1 (
  echo [..] Installation de pipx...
  %PY% -m pip install --user --upgrade pipx
  %PY% -m pipx ensurepath
) else (
  echo [OK] pipx deja present.
)

rem --- Outils Python (pipx = pas de doublon, environnements isoles) ---
rem  Impacket est sur PyPI ; NetExec et enum4linux-ng n'y sont pas (ou plus) :
rem  on les installe depuis leur depot GitHub officiel.
call :assure_pipx impacket "impacket"
call :assure_pipx netexec "git+https://github.com/Pennyw0rth/NetExec"
call :assure_pipx enum4linux-ng "git+https://github.com/cddmp/enum4linux-ng"

rem --- Responder (clone officiel, seulement s'il est absent) ---
set "RESP=%USERPROFILE%\outils-attaques\Responder"
if exist "%RESP%\Responder.py" (
  echo [OK] Responder deja present dans %RESP%.
) else (
  echo [..] Clonage de Responder...
  git clone --depth 1 https://github.com/lgandx/Responder "%RESP%"
)

:psexec
rem --- PsExec (Sysinternals) ---
where psexec >nul 2>nul
if errorlevel 1 (
  echo [..] Installation de PsExec (Sysinternals)...
  winget install --id Microsoft.Sysinternals.PsExec -e --source winget --accept-package-agreements --accept-source-agreements
  if errorlevel 1 winget install --id Microsoft.Sysinternals -e --source winget --accept-package-agreements --accept-source-agreements
) else (
  echo [OK] PsExec deja present.
)

echo.
echo [OK] Termine. Fermez puis rouvrez votre terminal pour recharger le PATH.
goto :fin

:assure_cmd
rem %1 = commande a tester, %2 = id winget, %3 = nom affiche
where %1 >nul 2>nul
if errorlevel 1 (
  echo [..] Installation de %3...
  winget install --id %2 -e --source winget --accept-package-agreements --accept-source-agreements
) else (
  echo [OK] %3 deja present.
)
exit /b 0

:assure_pipx
rem %1 = nom du paquet dans pipx, %2 = paquet (nom PyPI ou URL git) a installer
%PY% -m pipx list 2>nul | findstr /I /C:"package %1 " >nul
if errorlevel 1 (
  echo [..] Installation de %1 via pipx...
  %PY% -m pipx install %2
) else (
  echo [OK] %1 deja installe via pipx.
)
exit /b 0

:fin
echo.
pause
exit /b
</script>

  <script type="text/plain" id="installateur-outils-linux">
#!/usr/bin/env bash
# ===========================================================
#  Installation des outils d'attaque (Linux)
#  nmap, Impacket, NetExec, enum4linux-ng, Responder
#  (PsExec est un binaire Windows ; sous Linux, impacket-psexec)
#  A n'utiliser que sur un reseau de test autorise.
# ===========================================================
set -euo pipefail

vert()  { printf '\033[32m%s\033[0m\n' "$*"; }
jaune() { printf '\033[33m%s\033[0m\n' "$*"; }
rouge() { printf '\033[31m%s\033[0m\n' "$*"; }

echo "============================================================"
echo "  Installation des outils d'attaque (Linux)"
echo "  nmap, Impacket, NetExec, enum4linux-ng, Responder"
echo "============================================================"

# --- On n'exige pas root : sudo seulement si besoin ---
if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

# --- Detection du gestionnaire de paquets ---
if   command -v apt-get >/dev/null 2>&1; then GEST="apt"
elif command -v dnf     >/dev/null 2>&1; then GEST="dnf"
elif command -v pacman  >/dev/null 2>&1; then GEST="pacman"
else rouge "[X] Gestionnaire de paquets non reconnu (apt / dnf / pacman)."; exit 1
fi
vert "[OK] Gestionnaire detecte : $GEST"

pkg_install() {
  case "$GEST" in
    apt)    $SUDO apt-get update -y && $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y "$@" ;;
    dnf)    $SUDO dnf install -y "$@" ;;
    pacman) $SUDO pacman -Sy --noconfirm "$@" ;;
  esac
}

assure_sys() {
  # $1 = commande a tester ; $2... = paquets a installer si absente
  local cmd="$1"; shift
  if command -v "$cmd" >/dev/null 2>&1; then
    vert "[OK] $cmd deja present."
  else
    jaune "[..] Installation de $cmd..."
    pkg_install "$@"
  fi
}

# --- Prerequis systeme (git est requis pour installer NetExec/enum4linux-ng) ---
assure_sys nmap nmap
assure_sys git  git
assure_sys python3 python3
python3 -m pip --version >/dev/null 2>&1 || pkg_install python3-pip

# --- pipx ---
if command -v pipx >/dev/null 2>&1; then
  vert "[OK] pipx deja present."
else
  jaune "[..] Installation de pipx..."
  case "$GEST" in
    pacman) pkg_install python-pipx || python3 -m pip install --user --upgrade pipx ;;
    *)      pkg_install pipx        || python3 -m pip install --user --upgrade pipx ;;
  esac
  python3 -m pipx ensurepath >/dev/null 2>&1 || true
  export PATH="$HOME/.local/bin:$PATH"
fi

assure_pipx() {
  # $1 = nom du paquet dans pipx ; $2 = paquet (nom PyPI ou URL git) a installer
  if pipx list 2>/dev/null | grep -qiE "package $1 "; then
    vert "[OK] $1 deja installe (pipx)."
  else
    jaune "[..] Installation de $1 via pipx..."
    pipx install "$2"
  fi
}

# --- Outils Python (isoles, sans doublon) -----------------------------------
#  Impacket est sur PyPI ; NetExec et enum4linux-ng n'y sont pas (ou plus) :
#  on les installe depuis leur depot GitHub officiel.
assure_pipx impacket       "impacket"
assure_pipx netexec        "git+https://github.com/Pennyw0rth/NetExec"
assure_pipx enum4linux-ng  "git+https://github.com/cddmp/enum4linux-ng"

# --- Responder ---
if command -v responder >/dev/null 2>&1; then
  vert "[OK] Responder deja present (paquet systeme)."
else
  RESP="$HOME/outils-attaques/Responder"
  if [ -f "$RESP/Responder.py" ]; then
    vert "[OK] Responder deja present dans $RESP."
  else
    jaune "[..] Clonage de Responder..."
    mkdir -p "$HOME/outils-attaques"
    git clone --depth 1 https://github.com/lgandx/Responder "$RESP"
  fi
fi

echo
vert "[OK] Termine. Ouvrez un nouveau terminal pour recharger le PATH."
echo "PsExec est un binaire Windows : sous Linux, utilisez impacket-psexec (deja installe)."
</script>

  <script type="text/plain" id="installateur-outils-conteneurs">
#!/usr/bin/env bash
# ===========================================================
#  Installation de l'environnement « conteneurs » (Ubuntu)
#  Docker, k3s (Kubernetes), Helm, Trivy, htop, procps, nginx
#  A n'utiliser que sur une machine de test / TP autorisee.
# ===========================================================
# Principe : idempotent. Chaque outil n'est installe que s'il
# est absent (command -v). Sources officielles uniquement, pas
# de « curl | bash » aveugle : k3s et Helm sont TELECHARGES,
# puis executes, comme dans le TP1.
# ===========================================================
set -euo pipefail

vert()  { printf '\033[32m%s\033[0m\n' "$*"; }
jaune() { printf '\033[33m%s\033[0m\n' "$*"; }
rouge() { printf '\033[31m%s\033[0m\n' "$*"; }
titre() { printf '\n\033[1;36m== %s ==\033[0m\n' "$*"; }

echo "============================================================"
echo "  Installation de l'environnement conteneurs (Ubuntu)"
echo "  Docker, k3s, Helm, Trivy, htop, procps, nginx"
echo "============================================================"

# --- On n'exige pas root : sudo seulement si besoin ---
if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

# --- Verifie qu'on est bien sur une base apt (Ubuntu/Debian) ---
if ! command -v apt-get >/dev/null 2>&1; then
  rouge "[X] Ce script cible Ubuntu/Debian (apt-get introuvable)."
  exit 1
fi

deja() { command -v "$1" >/dev/null 2>&1; }

titre "Mise a jour de l'index des paquets"
$SUDO apt-get update -y

# ----------------------------------------------------------
# 1) Outils systeme : htop, procps (top/ps/free), nginx, curl
# ----------------------------------------------------------
titre "Outils de base (htop, procps, nginx, curl)"
BASE=""
for p in htop procps nginx curl ca-certificates; do
  dpkg -s "$p" >/dev/null 2>&1 || BASE="$BASE $p"
done
if [ -n "$BASE" ]; then
  # shellcheck disable=SC2086
  $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y $BASE
  vert "[OK] Installes :$BASE"
else
  jaune "[..] htop, procps, nginx, curl deja presents."
fi

# ----------------------------------------------------------
# 2) Docker (paquet Ubuntu docker.io + plugin compose)
# ----------------------------------------------------------
titre "Docker"
if deja docker; then
  jaune "[..] Docker deja installe : $(docker --version)"
else
  $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2 || \
    $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
  $SUDO systemctl enable --now docker 2>/dev/null || true
  # Permettre a l'utilisateur courant d'utiliser docker sans sudo
  if [ "$(id -u)" -ne 0 ]; then
    $SUDO usermod -aG docker "$USER" || true
    jaune "[i] Ajoute au groupe docker : deconnectez/reconnectez-vous (ou 'newgrp docker')."
  fi
  vert "[OK] Docker installe."
fi

# ----------------------------------------------------------
# 3) k3s (distribution Kubernetes legere)
#    On TELECHARGE le script officiel, on le laisse lisible,
#    puis on l'execute (pas de pipe aveugle).
# ----------------------------------------------------------
titre "k3s (Kubernetes)"
if deja k3s || deja kubectl; then
  jaune "[..] k3s / kubectl deja present."
else
  TMP="$(mktemp -d)"
  jaune "[..] Telechargement de get.k3s.io dans $TMP/k3s-install.sh"
  curl -sfL https://get.k3s.io -o "$TMP/k3s-install.sh"
  jaune "[i] Inspectez-le si besoin :  less $TMP/k3s-install.sh"
  INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" $SUDO sh "$TMP/k3s-install.sh"
  # kubeconfig utilisable sans sudo
  mkdir -p "$HOME/.kube"
  $SUDO cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config" 2>/dev/null || true
  $SUDO chown "$(id -u):$(id -g)" "$HOME/.kube/config" 2>/dev/null || true
  vert "[OK] k3s installe. Verifiez :  kubectl get nodes"
fi

# ----------------------------------------------------------
# 4) Helm (gestionnaire de paquets Kubernetes)
#    Idem : script officiel telecharge puis execute.
# ----------------------------------------------------------
titre "Helm"
if deja helm; then
  jaune "[..] Helm deja installe : $(helm version --short 2>/dev/null || echo present)"
else
  TMP="$(mktemp -d)"
  curl -fsSL -o "$TMP/get-helm-3" https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
  chmod 700 "$TMP/get-helm-3"
  $SUDO "$TMP/get-helm-3"
  vert "[OK] Helm installe."
fi

# ----------------------------------------------------------
# 5) Trivy (scanner de vulnerabilites / SBOM / config)
#    Depot APT officiel Aqua Security.
# ----------------------------------------------------------
titre "Trivy"
if deja trivy; then
  jaune "[..] Trivy deja installe : $(trivy --version 2>/dev/null | head -n1)"
else
  $SUDO install -m 0755 -d /etc/apt/keyrings
  curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
    | $SUDO gpg --dearmor -o /etc/apt/keyrings/trivy.gpg
  CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME:-jammy}}")"
  echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb ${CODENAME} main" \
    | $SUDO tee /etc/apt/sources.list.d/trivy.list >/dev/null
  $SUDO apt-get update -y
  $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y trivy
  vert "[OK] Trivy installe."
fi

# ----------------------------------------------------------
#  Recapitulatif
# ----------------------------------------------------------
titre "Recapitulatif"
for o in docker kubectl k3s helm trivy htop top nginx; do
  if deja "$o"; then vert "[OK] $o"; else rouge "[MANQUE] $o"; fi
done

echo
vert "[OK] Termine. Ouvrez un nouveau terminal (PATH + groupe docker)."
echo "Verifs rapides :  docker ps   |   kubectl get nodes   |   trivy --version"
</script>
